<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <!-- No zooming: pinch is blocked (iPhone ignores user-scalable=0), double-tap zoom is off in the CSS (touch-action) -->
    <script src="no-zoom.js"></script>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#12100d">
    <!-- Same theme as the Apex Lift app on this device (Account → Theme): dark, light or the phone's setting -->
    <script src="theme-boot.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apex Coach">
    <title>Apex Coach</title>
    <link rel="manifest" href="coach.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preload" href="vendor/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="coach.css">
</head>
<body>
    <main id="main" class="wrap" aria-live="polite">
        <div class="top"><div class="logo-mark" dir="ltr">APEX <span>LIFT</span></div></div>
        <div class="skeleton" style="height:96px;margin-bottom:10px" aria-hidden="true"></div>
        <div class="skeleton" style="height:72px;margin-bottom:10px" aria-hidden="true"></div>
        <div class="skeleton" style="height:72px" aria-hidden="true"></div>
    </main>
    <!-- Floating dock, like the Apex Lift app: Home, Clients, Chats, Invite, Account (labels set in coach.js, in the app's language) -->
    <nav id="dock" class="dock" dir="ltr" hidden>
        <button data-tab="home" class="tap" aria-label="Home"><i data-lucide="house"></i></button>
        <button data-tab="clients" class="tap" aria-label="Clients"><i data-lucide="users"></i></button>
        <button data-tab="chats" class="tap" aria-label="Chats"><i data-lucide="message-circle"></i><span class="dock-badge num" hidden></span></button>
        <button data-tab="invite" class="tap" aria-label="Invite"><i data-lucide="user-plus"></i></button>
        <button data-tab="account" class="tap" aria-label="Account"><i data-lucide="user"></i></button>
    </nav>
    <div id="coach" class="coach" role="dialog" aria-modal="true" aria-label="Routine"></div>
    <script src="firebase-config.js"></script>
    <script src="vendor/firebase-12.19.0/firebase-app-compat.js"></script>
    <script src="vendor/firebase-12.19.0/firebase-auth-compat.js"></script>
    <script src="vendor/firebase-12.19.0/firebase-firestore-compat.js"></script>
    <script src="vendor/lucide-icons.js"></script>
    <script src="library.js"></script>
    <script src="calc.js"></script>
    <script src="i18n.js"></script>
    <script src="coach-i18n.js"></script>
    <script src="admin-utils.js"></script>
    <script src="coach-builder.js"></script>
    <script src="coach-sign-in.js"></script>
    <script src="coach.js"></script>
</body>
</html>
